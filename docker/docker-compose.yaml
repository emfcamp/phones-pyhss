services:

  pyhss_api:
    image: ghcr.io/emfcamp/phones-pyhss:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile
    env_file:
        - ../docker/.env
    environment:
      CONTAINER_ROLE: "api"
    container_name: "pyhss_api"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pyhss_logs:/opt/pyhss/logs
      - pyhss_sqlite:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/oam/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    depends_on:
      redis:
        condition: service_healthy

  pyhss_metrics:
    image: ghcr.io/emfcamp/phones-pyhss:latest
    env_file:
        - ../docker/.env
    environment:
      CONTAINER_ROLE: "metrics"
    container_name: "pyhss_metrics"
    ports:
      - "127.0.0.1:9191:9191"
    volumes:
      - pyhss_logs:/opt/pyhss/logs
      - pyhss_sqlite:/var/lib/pyhss
    depends_on:
      redis:
        condition: service_healthy
      CONTAINER_ROLE: "diameter"
    container_name: "pyhss_diameter"
    ports:
      - "127.0.0.1:3868:3868"
    volumes:
      - pyhss_logs:/opt/pyhss/logs
      - pyhss_sqlite:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3868"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    depends_on:
      pyhss_api:
        condition: service_healthy

  pyhss_hss:
    image: ghcr.io/emfcamp/phones-pyhss:latest
    env_file:
        - ../docker/.env
    environment:
      CONTAINER_ROLE: "hss"
    container_name: "pyhss_hss"
    volumes:
      - pyhss_logs:/opt/pyhss/logs
      - pyhss_sqlite:/var/lib/pyhss
    depends_on:
      pyhss_diameter:
        condition: service_healthy

  pyhss_gsup:
    image: ghcr.io/emfcamp/phones-pyhss:latest
    env_file:
        - ../docker/.env
    container_name: "pyhss_gsup"
    environment:
      CONTAINER_ROLE: "gsup"
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - pyhss_logs:/opt/pyhss/logs
      - pyhss_sqlite:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: "redis:7.2-alpine"
    container_name: "redis"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
      start_interval: 0.1s
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis_data:
  pyhss_logs:
  pyhss_sqlite:
