name: CI Build

on:
  push:
    branches:
      - emf2026-hacks
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  packages: write

jobs:
  build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: docker_build
        uses: docker/build-push-action@v7
        env:
          APP_BUILD: ${{ github.sha }}
          DOCKER_BUILD_RECORD_UPLOAD: false
          SOURCE_DATE_EPOCH: 0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/emfcamp/pyhss:latest

